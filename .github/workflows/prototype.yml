name: Checks and desktop installers

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use official Ubuntu archive mirror
        run: bash scripts/ci-ubuntu-mirror.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/test-graph.mjs
      - run: node scripts/test-i18n.mjs
      - run: node scripts/test-collect-artifacts.mjs
      - run: python3 scripts/test-linux-bridge-diagnostics.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-ui.mjs
      - run: cargo fmt --all --check
      - run: cargo test --locked -p gatherpack-collection
      - name: ZIP64 large file roundtrip
        run: cargo test --locked --release -p gatherpack-collection zip64_large_file_roundtrip -- --ignored

  installers:
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Use official Ubuntu archive mirror
        if: runner.os == 'Linux'
        run: bash scripts/ci-ubuntu-mirror.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/gatherpack-sources.list > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y curl libcurl4 libcurl3-gnutls libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2 python3-gi python3-nautilus python3-pyatspi gir1.2-gtk-3.0 gir1.2-gtk-4.0 x11-utils xvfb dbus-x11 xdotool
          sudo python3 scripts/refresh-runtime-libraries-linux.py --apply
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - run: node scripts/license-notices.mjs
      - name: Record actual host and requested target
        shell: bash
        run: |
          rustc -vV
          echo "requested-target=${{ matrix.target }}"
      - name: Pin verified AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/download-appimage-runtime-linux.sh
          echo "LDAI_RUNTIME_FILE=$HOME/.cache/tauri/gatherpack-runtime-x86_64" >> "$GITHUB_ENV"
      - name: Build desktop installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked; then
              exit 0
            fi
            # Finder / Spotlight can briefly hold the intermediate DMG volume.
            if [ "$RUNNER_OS" != macOS ] || [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Enforce Ubuntu 22.04 glibc baseline
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check-glibc-linux.py "target/${{ matrix.target }}/release/gatherpack" artifacts/validation/glibc-executable.json
          python3 scripts/check-glibc-linux.py "target/${{ matrix.target }}/release/bundle/appimage/GatherPack.AppDir" artifacts/validation/glibc-appimage.json
      - name: AppImage system notices and corresponding source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          bash scripts/finalize-appimage-linux.sh "target/${{ matrix.target }}/release/bundle" "artifacts/${{ matrix.target }}/gatherpack-$version-${{ matrix.target }}-corresponding-source.tar"
      - name: Real native IPC and restart validation on native host
        shell: bash
        env:
          REQUESTED_TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$REQUESTED_TARGET" ]; then
            echo "Cross-built target: execution requires its matching target machine."
          elif [ "$RUNNER_OS" = Linux ]; then
            cargo test --locked --release --target "$REQUESTED_TARGET" -p gatherpack
            xvfb-run -a dbus-run-session -- node scripts/test-native.mjs "target/$REQUESTED_TARGET/release/gatherpack"
            xvfb-run -a dbus-run-session -- node scripts/test-profile-migration.mjs "target/$REQUESTED_TARGET/release/gatherpack"
          elif [ "$RUNNER_OS" = Windows ]; then
            cargo test --locked --release --target "$REQUESTED_TARGET" -p gatherpack
            node scripts/test-native.mjs "target/$REQUESTED_TARGET/release/gatherpack.exe"
          else
            cargo test --locked --release --target "$REQUESTED_TARGET" -p gatherpack
            node scripts/test-native.mjs "target/$REQUESTED_TARGET/release/gatherpack"
          fi
      - run: node scripts/collect-artifacts.mjs ${{ matrix.target }}
      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-${{ matrix.target }}
          path: |
            artifacts/validation/**/native-*.json
            artifacts/validation/glibc-*.json
          if-no-files-found: warn
      - uses: ./.github/actions/upload-installers
        with:
          target: ${{ matrix.target }}
          directory: artifacts/${{ matrix.target }}

  linux-package-compatibility:
    needs: installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Use official Ubuntu archive mirror
        run: bash scripts/ci-ubuntu-mirror.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: gatherpack-linux-x64-deb
          path: artifacts/deb
      - name: Install and run the delivered Debian package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 xauth xdotool ./artifacts/deb/*.deb
          python3 scripts/check-glibc-linux.py /usr/bin/gatherpack artifacts/validation/glibc-installed.json
          ldd /usr/bin/gatherpack > artifacts/validation/ldd-installed.txt
          ! grep -q 'not found' artifacts/validation/ldd-installed.txt
          xvfb-run -a dbus-run-session -- node scripts/test-native.mjs /usr/bin/gatherpack
          xvfb-run -a dbus-run-session -- node scripts/test-profile-migration.mjs /usr/bin/gatherpack
          sudo apt-get remove -y gather-pack
          test ! -e /usr/bin/gatherpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-package-validation-${{ matrix.os }}
          path: |
            artifacts/validation/glibc-installed.json
            artifacts/validation/ldd-installed.txt
            artifacts/validation/**/native-*.json
            artifacts/validation/profile-migration-report.json
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installers, linux-package-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "GatherPack $RELEASE_TAG" --notes "File collection and archive alpha. Review docs/prototype-validation.md for desktop compatibility and remaining verification."
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*-corresponding-source.tar' -o -name '*-provenance.json' \) -print0 | xargs -0 -r gh release upload "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$(find release-assets -name THIRD_PARTY_NOTICES.md -print -quit)" "$(find release-assets -name LICENSE -print -quit)" "$(find release-assets -name third-party.md -print -quit)" "$(find release-assets -name license-audit.json -print -quit)"
          find release-assets -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt

