[package]
name = "gatherpack-collection"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6.1"
tempfile = "3"
unicode-normalization = "0.1"
libc = "0.2"
